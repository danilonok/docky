name: CD
on: [push]
jobs:
  docker-compose: 
    name: docker-compose
    runs-on: self-hosted
    environment: CD
    env: 
      AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POSTGRES_HOST: ${{secrets.POSTGRES_HOST}}
      AWS_HOST: ${{secrets.AWS_HOST}}
      OLLAMA_HOST: ${{secrets.OLLAMA_HOST}}
      QDRANT_HOST: ${{secrets.QDRANT_HOST}}
      DOCLING_HOST: ${{secrets.DOCLING_HOST}}
      RABBIT_MQ_HOST: ${{ secrets.RABBIT_MQ_HOST }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_API_BASE: ${{ vars.LLM_API_BASE }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_CONTEXT_WINDOW: ${{ vars.LLM_CONTEXT_WINDOW }}
      LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
      EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      EMBEDDING_API_BASE: ${{ vars.EMBEDDING_API_BASE }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: build-images
        run: docker-compose build
      - name: run-compose
        run: docker-compose up -d
