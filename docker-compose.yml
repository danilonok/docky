x-app-env: &app-env
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  AWS_HOST: ${AWS_HOST}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  QDRANT_HOST: ${QDRANT_HOST}
  RABBIT_MQ_HOST: ${RABBIT_MQ_HOST}
  DOCLING_HOST: ${DOCLING_HOST}
  OLLAMA_HOST: ${OLLAMA_HOST}
  LLM_PROVIDER: ${LLM_PROVIDER}
  LLM_MODEL: ${LLM_MODEL}
  LLM_API_BASE: ${LLM_API_BASE}
  LLM_API_KEY: ${LLM_API_KEY}
  LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL}
  EMBEDDING_API_BASE: ${EMBEDDING_API_BASE}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
  DOCUMENT_PARSER: ${DOCUMENT_PARSER}
  DOCLING_DO_OCR: ${DOCLING_DO_OCR}
  DOCLING_TIMEOUT: ${DOCLING_TIMEOUT}
  CHUNK_SIZE: ${CHUNK_SIZE}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP}

# Every process running our code shares an image and an environment.
x-app: &app
  image: ${DOCKY_IMAGE:-docky}:${DOCKY_TAG:-latest}
  environment: *app-env

services:
  db:
    image: postgres:17
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  rabbitmq:
    image: rabbitmq:4.3.5
    container_name: rabbitmq_service
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  minio:
    image: quay.io/minio/minio
    container_name: minio_service
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant_service
    volumes:
      - qdrant:/qdrant/storage
    # The image has no curl or wget, so this opens a TCP socket with bash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  # Runs to completion before the app starts, and brings external state up to
  # date: the schema (a fresh database is otherwise empty and every request
  # 500s) and the bucket (without it every upload 500s). Both steps are
  # idempotent, so this runs on every deploy. A failure here blocks startup
  # rather than producing an app that cannot serve a request.
  init:
    <<: *app
    command: sh -c "alembic upgrade head && python -m app.scripts.init_storage"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  celery_worker:
    <<: *app
    command: celery -A app.tasks worker --loglevel=info -P solo
    depends_on:
      init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  # Serves the built SPA and proxies /api to the API — see frontend/app/Caddyfile.
  # This is the only service a browser talks to; `api` itself stays internal.
  frontend:
    image: ${DOCKY_FRONTEND_IMAGE:-docky-frontend}:${DOCKY_TAG:-latest}
    environment:
      # Which edition's copy the SPA shows. One image serves both; the container
      # renders /config.json from this on start. Each deployment's override file
      # sets it, so this default only covers running the base file on its own.
      DOCKY_EDITION: ${DOCKY_EDITION:-cloud}
    depends_on:
      api:
        condition: service_started
    restart: always

volumes:
  pgdata:
  rabbitmq:
  minio:
  qdrant:
