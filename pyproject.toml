[project]
name = "docky"
version = "0.1.0"
description = "Self-hosted RAG platform — upload documents, chat with them using local LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "arize-phoenix[evals]>=13.0.3",
    "boto3>=1.42.26",
    "celery>=5.6.2",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.128.0",
    "llama-index>=0.14.12",
    "llama-index-embeddings-ollama>=0.8.6",
    "llama-index-llms-ollama>=0.9.1",
    "llama-index-vector-stores-qdrant>=0.9.1",
    "openinference-instrumentation-llama-index>=2.0.0",
    "psycopg2-binary>=2.9.11",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt[argon2]>=2.10.1",
    "sqlmodel>=0.0.31",
]
