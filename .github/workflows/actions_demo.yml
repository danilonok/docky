name: CI
on: [push]
jobs:
  uv-install: 
    name: python
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Install UV
        uses: astral-sh/setup-uv@v7      
      - name: Set up Python
        run: uv python install
      - name: sync
        run: uv sync
      
