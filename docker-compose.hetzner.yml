
services:
  frontend:
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: always

  api:
    environment:
      FORWARDED_ALLOW_IPS: "*"

volumes:
  caddy_data:
  caddy_config:
